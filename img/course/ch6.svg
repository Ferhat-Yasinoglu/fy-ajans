<style>
.mote{animation-name:mote;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 6s ease-in-out infinite alternate}
@keyframes mote{from{transform:translateY(9px);opacity:.14}to{transform:translateY(-13px);opacity:.85}}
@keyframes glow{from{opacity:.68;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}
.bar{transform-box:fill-box;transform-origin:center bottom;animation-name:bar;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.rise{animation-name:rise;animation-timing-function:ease-out;animation-iteration-count:infinite}
.play{transform-box:fill-box;transform-origin:center;animation:play 3.2s ease-in-out infinite}
@keyframes bar{from{transform:scaleY(.28)}to{transform:scaleY(1)}}
@keyframes rise{0%{transform:translateY(80px) scale(.55);opacity:0}14%,80%{opacity:1}100%{transform:translateY(-230px) scale(1.1);opacity:0}}
@keyframes play{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}</style>
