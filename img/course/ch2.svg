<style>
.mote{animation-name:mote;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 6s ease-in-out infinite alternate}
@keyframes mote{from{transform:translateY(9px);opacity:.14}to{transform:translateY(-13px);opacity:.85}}
@keyframes glow{from{opacity:.68;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}
.pl{animation:pl 5.5s ease-in-out infinite}
.out{transform-box:fill-box;transform-origin:center;animation:out 5.5s ease-in-out infinite}
.oh{transform-box:fill-box;transform-origin:center;animation:oh 5.5s ease-in-out infinite}
.flow{animation:flow 2.2s linear infinite}
@keyframes pl{0%,100%{opacity:.62}12%{opacity:1}40%{opacity:.62}}
@keyframes out{0%,62%,100%{transform:scale(1)}72%{transform:scale(1.13)}}
@keyframes oh{0%,62%,100%{opacity:.5}72%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}</style>
