name = "fy-ajans"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers Builds (GitHub deposu bağlı): Cloudflare panosunda Worker adı "fy-ajans"; wrangler
# config buradaki ad ile aynı olmak ZORUNDA. Panoda Settings → Build → Root directory = worker,
# Deploy command = npx wrangler deploy. main dalına her push otomatik dağıtır.

[vars]
# Yalnızca bu kaynaklardan gelen isteklere yanıt verilir (virgülle ayır). Alan adı değişince güncelle.
# BOŞ BIRAKILIRSA worker hiçbir isteğe yanıt vermez (eskiden tam tersiydi: boşsa herkese açılıyordu).
ALLOWED_ORIGINS = "https://ferhat-yasinoglu.github.io"
# Ziyaretçi başına günlük soru hakkı
DAILY_LIMIT = "10"
# Model: en yetenekli seçenek claude-sonnet-5; bütçe için claude-haiku-4-5 (yarı fiyat).
# Model kimliğine tarih eki YAZMA — bu dizeler olduğu gibi tamdır.
MODEL = "claude-sonnet-5"
# Anthropic anahtarı girilmezse Workers AI kullanılır (ücretsiz katman: günde 10.000 nöron).
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Günlük sayaç için KV alanı. `npx wrangler kv namespace create QUOTA` çıktısındaki id'yi
# aşağıya yaz. YAZILMAZSA worker hiçbir soruya yanıt vermez (503): sayaç bağlı değilken
# sınır uygulanamıyor, o yüzden açık bırakmak yerine kapalı kalıyor.
[[kv_namespaces]]
binding = "QUOTA"
id = "ac1964cdbb1e48ce8f2f8df00bb05688"

# Gizli anahtar wrangler.toml'a YAZILMAZ; terminalden girilir:
#   npx wrangler secret put ANTHROPIC_API_KEY

# ---------------------------------------------------------------------------
# SESLİ YANIT (/tts) — FYOS'un yanıtlarını gerçek bir insan sesiyle okutur.
# Anahtar girilmezse /tts kapalı kalır (503) ve site tarayıcının kendi sesine döner;
# yani burayı boş bırakmak bir şeyi bozmaz, yalnızca ses robotik kalır.
# İkisinden BİRİNİ gir:
#   npx wrangler secret put OPENAI_API_KEY       # OpenAI TTS — ucuz, Türkçesi iyi
#   npx wrangler secret put ELEVENLABS_API_KEY   # ElevenLabs — daha iyi ses, daha pahalı
# İkisi de varsa ElevenLabs kullanılır.
#
# Aşağıdakiler BİLEREK yorumda: [vars] içindeki bir değer her zaman tanımlı olur ve
# sağlayıcı değiştirdiğinde yanlış modeli gönderir. Yorumda kalırsa kod, hangi anahtar
# varsa o sağlayıcının doğru varsayılanını seçer.
# TTS_VOICE = "coral"                  # OpenAI'de ses adı (varsayılan coral: genç, sıcak kadın
#                                      # sesi; shimmer/nova/sage benzer, alloy nötr).
#                                      # ElevenLabs'te bu alan voice id'dir.
# TTS_MODEL = "gpt-4o-mini-tts"        # ElevenLabs için: eleven_multilingual_v2
# TTS_INSTRUCTIONS = "..."             # Sesin NASIL konuşacağı (OpenAI). Boşsa src/index.js
#                                      # içindeki TTS_STYLE: gülümseyerek, sıcak, arkadaşça.
# TTS_STABILITY = "0.35"               # ElevenLabs ifade ayarları: düşük stability = daha canlı
# TTS_SIMILARITY = "0.75"
# TTS_STYLE_LEVEL = "0.5"
#
# Frenler src/index.js başındadır: istek başına 500 karakter, ziyaretçi başına günde
# 2500 karakter. Sağlayıcı panelinde aylık harcama tavanını da koy.
# ---------------------------------------------------------------------------

# Ücretsiz açık model için Workers AI bağlantısı (Anthropic anahtarı yoksa devreye girer)
[ai]
binding = "AI"

# Günlükler (console.error satırları) panoda Observability sekmesinde görünsün. Ücretsiz planda
# günde 200K olay. Buraya yazılmazsa panodan açılan ayar bir sonraki dağıtımda kapanabilir.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# İSTEĞE BAĞLI AMA ÖNERİLİR: Cloudflare'in yerleşik hız sınırı bağlantısı.
# Günlük sayaç KV'de tutuluyor ve KV atomik artırma yapamaz; yani eşzamanlı isteklerde
# sayaç tam güvenilir değil. Kenarda atomik çalışan tek fren budur. Bağlanırsa
# src/index.js kendiliğinden kullanır (env.RATE_LIMITER), bağlanmazsa atlar.
#
# DİKKAT: aşağıdaki blok yorumdadır ve buradan doğrulanamadı (bu ortamda Cloudflare
# dokümanına ağ erişimi yok). Açmadan önce güncel söz dizimini Cloudflare Workers
# «Rate Limiting» dokümanından doğrula; `period` yalnızca 10 ya da 60 saniye olabilir.
#
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 3, period = 10 }
# ---------------------------------------------------------------------------
